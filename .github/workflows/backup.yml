name: backup

# 每週把 D1 匯出成 SQL 存到 R2 backups/d1/，保留 90 天（R2 生命週期規則自動刪除舊檔）
# D1 本身另有 30 天 Time Travel 可還原到任一時間點；這份是長期、可攜的副本
on:
  schedule:
    - cron: "0 19 * * 0" # 每週一 03:00（台北時間）
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 匯出 D1 並上傳 R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          file="jteam-$(date -u +%Y-%m-%dT%H%M%SZ).sql"
          npx wrangler d1 export jteam --remote --output "$file" -c infra/wrangler.jsonc
          # 匯出檔至少要有建表語句，避免把空檔當成成功的備份
          grep -q "CREATE TABLE" "$file" || { echo "匯出內容異常"; exit 1; }
          gzip -9 "$file"
          npx wrangler r2 object put "jteam/backups/d1/$file.gz" --remote --file "$file.gz" \
            --content-type application/gzip -c infra/wrangler.jsonc
          echo "已備份 backups/d1/$file.gz（$(du -h "$file.gz" | cut -f1)）"
