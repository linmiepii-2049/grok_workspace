# 投資帳本：每天的資產、損益、績效都從這份檔案重新計算
# 改完推上 main，網頁幾分鐘內就會更新；格式說明見 README.md
#
# ⚠ 下面是範例數字，請換成你自己的再推上去

opening_date: 2026-10-29 # 起始日：從這天開始記錄資產曲線

# ── 帳戶與現金 ────────────────────────────────
# 每個帳戶一種幣別；cash 是起始日當天的現金餘額
# 證券交割戶、銀行存款都列在這裡
accounts:
  - name: 國泰證券
    currency: TWD
    cash: 350000
  - name: Firstrade
    currency: USD
    cash: 2400
  - name: 台新銀行
    currency: TWD
    cash: 500000

# ── 起始部位（起始日以前就持有的）────────────
opening_positions:
  - symbol: 2330.TW # 台股上市加 .TW，上櫃加 .TWO
    account: 國泰證券
    shares: 1000
    avg_cost: 620 # 每股平均成本，原幣、含手續費（券商 App 的「成本均價」）
  - symbol: 0050.TW
    account: 國泰證券
    shares: 2000
    avg_cost: 145.3
  - symbol: NVDA # 美股直接寫代號
    account: Firstrade
    shares: 30
    avg_cost: 118.5 # 美元
    cost_fx: 31.2 # 買進時的平均匯率（1 美元兌台幣）；不填就用起始日匯率

# ── 交易紀錄（起始日之後，依時間往下加）──────
# type 可以是：buy 買進、sell 賣出、dividend 現金股利、stock_dividend 配股、
#             interest 利息、deposit 入金、withdraw 出金
# 範例先註解掉，有交易時照格式取消註解或新增
transactions:
  # - date: 2026-11-03
  #   type: buy
  #   symbol: 2330.TW
  #   account: 國泰證券
  #   shares: 100
  #   price: 1050
  #   fee: 150 # 不填：台股用 0.1425%（最低 20 元）自動算，美股算 0

  # - date: 2026-11-10
  #   type: sell
  #   symbol: NVDA
  #   account: Firstrade
  #   shares: 10
  #   price: 205
  #   fx: 32.1 # 成交日匯率；不填就用當天收盤匯率
  #   # 台股證交稅自動算：股票 0.3%、ETF 0.1%；要自己填就寫 tax:

  # - date: 2026-11-15
  #   type: dividend
  #   symbol: 0050.TW
  #   account: 國泰證券
  #   amount: 5000 # 入帳前的股利總額
  #   tax: 0 # 被扣掉的稅、補充保費；美股預扣 30% 填在這裡

  # - date: 2026-11-20
