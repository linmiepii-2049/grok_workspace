<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #ccc; }
  .slide {
    --k: 1;
    position: relative; overflow: hidden;
    width: var(--w); height: var(--h);
    background: var(--bg); color: var(--ink);
    font-family: var(--f-body), serif; font-weight: 400;
    line-break: strict; overflow-wrap: anywhere;
    margin-bottom: 40px;
  }
  .frame {
    position: absolute; inset: 110px 96px 190px 96px;
    display: flex; flex-direction: column; z-index: 3;
  }
  .frame > * { flex: none; }
  .deco { position: absolute; z-index: 1; }
  .center { align-items: center; text-align: center; }

  /* 標題：雜誌襯線體，重點字斜體焦糖色 */
  .title {
    font-family: var(--f-title), serif; font-weight: var(--title-w);
    line-height: 1.3; letter-spacing: .02em; white-space: pre-line; text-wrap: balance;
  }
  em { font-style: italic; color: var(--rust); font-weight: 700; }
  .body em, p em, .c em, .card em { font-style: normal; }
  .caps { font-family: var(--f-latin), serif; letter-spacing: .22em; text-transform: uppercase; }
  .script { font-family: var(--f-script), cursive; color: var(--caramel); font-weight: 400; line-height: 1; }
  .kicker { font-size: calc(var(--k) * 28px); color: var(--rust); letter-spacing: .3em; margin-bottom: 22px; }
  .rule { width: 130px; height: 2px; background: var(--line); margin: 40px 0 44px; }
  .center .rule { align-self: center; }
  .body { font-size: calc(var(--k) * 34px); line-height: 1.8; color: var(--muted); white-space: pre-line; text-wrap: pretty; }
  .dot { border-radius: 50%; }

  /* 頁尾：細金線，中間壓一顆深色膠囊 */
  footer {
    position: absolute; left: 0; right: 0; bottom: 80px; z-index: 4; height: 44px;
    display: flex; align-items: center; justify-content: space-between; padding: 0 96px;
    font-family: var(--f-latin), serif; font-size: 24px; color: var(--muted);
  }
  footer { gap: 22px; }
  footer .ln { flex: 1; height: 2px; background: var(--line); }
  footer .tag { background: var(--ink); color: var(--pale); font-style: italic; border-radius: 999px; padding: 6px 30px; font-size: 22px; letter-spacing: .06em; }

  /* cover */
  .t-cover .shot { left: 330px; top: 96px; width: 654px; height: 600px; z-index: 2; overflow: hidden; }
  .t-cover .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .t-cover .shot.empty { background: var(--caramel); display: grid; place-items: center; font-family: var(--f-title); font-size: 300px; color: var(--pale); }
  .t-cover .hand { left: 70px; top: 590px; z-index: 3; font-size: 120px; transform: rotate(-7deg); white-space: nowrap; text-shadow: 0 0 18px var(--bg), 0 0 6px var(--bg); }
  .t-cover .frame { inset: 740px 96px 170px 96px; }
  .t-cover .series { font-size: calc(var(--k) * 26px); color: var(--rust); margin-bottom: 18px; }
  .t-cover .title { font-size: calc(var(--k) * 100px); line-height: 1.22; }
  .t-cover .sub { font-size: calc(var(--k) * 34px); color: var(--muted); margin-top: 26px; }

  /* statement */
  .t-statement .frame { justify-content: center; }
  .chev { display: flex; gap: 2px; margin-bottom: 18px; }
  .chev svg { width: 34px; height: 40px; }
  .t-statement .title { font-size: calc(var(--k) * 108px); }

  /* compare */
  .t-compare .title { font-size: calc(var(--k) * 76px); text-align: center; }
  .t-compare .rule { align-self: center; }
  .cmp { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 18px 26px; }
  .cmp .h { font-size: calc(var(--k) * 28px); text-align: center; padding: 14px 0; border-radius: 999px; letter-spacing: .14em; margin-bottom: 8px; border: 2px solid var(--ink); }
  .cmp .h.b { background: var(--ink); color: var(--pale); }
  .t-compare .vs { align-self: center; font-size: 96px; margin: 0 0 26px; }
  .cmp .c { border-radius: 22px; padding: 28px 30px; font-size: calc(var(--k) * 32px); line-height: 1.5; display: flex; align-items: center; }
  .cmp .c.a { background: var(--tan); color: var(--muted); }
  .cmp .c.b { background: var(--card); box-shadow: 0 8px 24px rgba(80,60,40,.10); }

  /* steps：深色圓編號＋膠囊標籤 */
  .t-steps .title { font-size: calc(var(--k) * 86px); }
  .t-steps .hand { align-self: flex-end; font-size: 84px; margin: 0 0 22px; transform: rotate(-6deg); }
  .step { display: flex; gap: 32px; align-items: flex-start; padding: 28px 0; }
  .step .n { flex: none; width: 92px; height: 92px; border-radius: 50%; background: var(--ink); color: var(--pale); display: grid; place-items: center; font-family: var(--f-latin); font-style: italic; font-size: calc(var(--k) * 46px); box-shadow: 0 0 0 6px var(--bg), 0 0 0 8px var(--caramel); }
  .step h3 { display: inline-block; font-family: var(--f-title); font-size: calc(var(--k) * 40px); font-weight: 600; background: var(--card); padding: 4px 26px; border-radius: 999px; margin: 6px 0 10px; box-shadow: 0 4px 14px rgba(80,60,40,.10); }
  .step p { font-size: calc(var(--k) * 30px); color: var(--muted); line-height: 1.55; }

  /* before / after：Q&A 大字母 */
  .t-beforeafter .title { font-size: calc(var(--k) * 90px); margin-bottom: 50px; }
  .ba { position: relative; padding-left: 150px; }
  .ba .big { position: absolute; left: -10px; top: -40px; font-family: var(--f-latin); font-size: calc(var(--k) * 230px); line-height: 1; z-index: 2; }
  .ba.before .big { color: var(--caramel); }
  .card { position: relative; z-index: 1; border-radius: 26px; padding: 36px 42px; font-size: calc(var(--k) * 34px); line-height: 1.65; text-wrap: pretty; }
  .card .lab { font-size: 22px; letter-spacing: .3em; margin-bottom: 10px; color: var(--rust); }
  .ba.before .card { background: var(--tan); color: var(--muted); }
  .ba.after .card { background: var(--card); box-shadow: 0 10px 30px rgba(80,60,40,.12); }
  .ba + .ba { margin-top: 56px; }
  .note { margin-top: 48px; font-size: calc(var(--k) * 34px); font-weight: 700; color: var(--ink); }
  .note::before { content: "✦"; color: var(--caramel); margin-right: 16px; }

  /* quote：對話框 */
  .t-quote .frame { justify-content: center; }
  .who { display: flex; flex-direction: column; align-items: center; margin-bottom: 36px; }
  .face { width: 150px; height: 150px; border-radius: 50%; overflow: hidden; background: var(--caramel); border: 8px solid var(--card); box-shadow: 0 8px 22px rgba(80,60,40,.18); display: grid; place-items: center; font-family: var(--f-latin); font-size: 64px; color: var(--pale); }
  .face img { width: 100%; height: 100%; object-fit: cover; }
  .who .nm { margin-top: 18px; font-size: 26px; }
  .bubble { position: relative; z-index: 2; background: var(--pale); border: 3px solid var(--ink); border-radius: 64px; padding: 70px 60px; }
  .bubble::after { content: ""; position: absolute; left: 90px; bottom: -26px; width: 46px; height: 46px; background: var(--pale); border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: rotate(45deg); }
  .t-quote .title { font-size: calc(var(--k) * 88px); line-height: 1.42; }
  .t-quote .by { margin-top: 44px; font-size: 96px; }

  /* cta */
  .t-cta .frame { justify-content: center; }
  .stars { color: var(--mustard); font-size: 46px; letter-spacing: .2em; margin-bottom: 24px; }
  .t-cta .face { width: 175px; height: 175px; border-width: 9px; margin-bottom: 36px; } /* 形象照刻意放小（使用者要求，2026-10-29 縮小 30%） */
  .t-cta .title { font-size: calc(var(--k) * 86px); }
  .t-cta .body { margin-top: 30px; }
  .btn { margin-top: 44px; background: var(--ink); color: var(--pale); font-size: calc(var(--k) * 36px); font-weight: 700; padding: 22px 64px; border-radius: 999px; letter-spacing: .06em; }
  .t-cta .thanks { font-size: 100px; margin-top: 30px; }
  .handle { font-size: 30px; color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// **重點** → <em>重點</em>
const hl = s => esc(s).replace(/\*\*([\s\S]+?)\*\*/g, '<em>$1</em>');
const title = s => `<div class="title">${hl(s)}</div>`;
const circle = (x, y, d, color) => `<div class="deco dot" style="left:${x}px;top:${y}px;width:${d}px;height:${d}px;background:var(--${color})"></div>`;
const chev = `<div class="chev">${[0, 1, 2].map(() => `<svg viewBox="0 0 34 40"><path d="M6 4 L26 20 L6 36" fill="none" stroke="var(--caramel)" stroke-width="3"/></svg>`).join('')}</div>`;
const face = t => `<div class="face">${t.avatar ? `<img src="${esc(t.avatar)}">` : esc(t.author[0])}</div>`;

const LAYOUTS = {
  cover: (s, p, t) => `
    ${circle(-170, 170, 440, 'caramel')}
    ${circle(900, 640, 240, 'pale')}
    <div class="deco shot ${s.photo ? '' : 'empty'}">${s.photo ? `<img src="${esc(s.photo)}">` : esc(p.emblem || '')}</div>
    <div class="deco hand script">${esc(t.author)}</div>
    <div class="frame">
      <div class="series caps">${esc(p.series)} · No.${esc(p.no)}</div>
      ${title(s.title)}
      ${s.sub ? `<div class="sub">${hl(s.sub)}</div>` : ''}
    </div>`,
  statement: s => `
    ${circle(860, 300, 400, 'caramel')}
    ${circle(-220, 980, 560, 'pale')}
    <div class="frame">
      ${chev}
      ${s.kicker ? `<div class="kicker caps">${hl(s.kicker)}</div>` : ''}
      ${title(s.title)}
      <div class="rule"></div>
      <div class="body">${hl(s.body)}</div>
    </div>`,
  compare: s => `
    ${circle(-120, -120, 300, 'caramel')}
    ${circle(930, 1000, 260, 'mustard')}
    <div class="frame">
      ${title(s.title)}
      <div class="vs script">vs</div>
      <div class="cmp">
        <div class="h a">${esc(s.a)}</div><div class="h b">${esc(s.b)}</div>
        ${s.rows.map(([a, b]) => `<div class="c a">${hl(a)}</div><div class="c b">${hl(b)}</div>`).join('')}
      </div>
    </div>`,
  steps: s => `
    ${circle(880, -100, 300, 'caramel')}
    ${circle(-140, 1040, 300, 'pale')}
    <div class="frame">
      ${title(s.title)}
      <div class="hand script">step by step</div>
      <div>${s.items.map(([h, d], i) => `<div class="step"><div class="n">${i + 1}</div><div><h3>${hl(h)}</h3><p>${hl(d)}</p></div></div>`).join('')}</div>
    </div>`,
  beforeafter: s => `
    ${circle(860, -140, 340, 'pale')}
    ${circle(760, 1000, 380, 'caramel')}
    <div class="frame">
      ${title(s.title)}
      <div class="ba before"><div class="big">B</div><div class="card"><div class="lab caps">Before</div>${hl(s.before)}</div></div>
      <div class="ba after"><div class="big">A</div><div class="card"><div class="lab caps">After</div>${hl(s.after)}</div></div>
      ${s.note ? `<div class="note">${hl(s.note)}</div>` : ''}
    </div>`,
  quote: (s, p, t) => `
    <div class="deco" style="left:-180px;top:520px;width:760px;height:640px;background:var(--tan);border-radius:58% 42% 55% 45% / 48% 60% 40% 52%"></div>
    ${circle(840, 140, 220, 'caramel')}
    <div class="frame center">
      <div class="who">${face(t)}<div class="nm caps">${esc(t.author)}</div></div>
      <div class="bubble">${title(s.text)}</div>
      <div class="by script">${esc(t.author)}</div>
    </div>`,
  cta: (s, p, t) => `
    ${circle(820, -140, 420, 'caramel')}
    ${circle(-160, 980, 420, 'pale')}
    <div class="frame center">
      <div class="stars">★★★★★</div>
      ${face(t)}
      ${title(s.title)}
      ${s.body ? `<div class="body">${hl(s.body)}</div>` : ''}
      ${s.button ? `<div class="btn">${hl(s.button)}</div>` : ''}
      <div class="thanks script">Thank you</div>
      <div class="handle">${esc(t.handle)}</div>
    </div>`,
};

// 內容超出就整張等比縮字
function settle(slide) {
  const frame = slide.querySelector('.frame');
  let k = 1;
  while (frame.scrollHeight > frame.clientHeight + 1 && k > 0.6) {
    k = +(k - 0.04).toFixed(2);
    slide.style.setProperty('--k', k);
  }
  return { k, overflow: frame.scrollHeight > frame.clientHeight + 1 };
}

window.render = (theme, post) => {
  const s = document.documentElement.style;
  const [w, h] = theme.size;
  s.setProperty('--w', w + 'px'); s.setProperty('--h', h + 'px');
  for (const [k, v] of Object.entries(theme.colors)) s.setProperty('--' + k, v);
  s.setProperty('--f-title', theme.fonts.title);
  s.setProperty('--f-body', theme.fonts.body);
  s.setProperty('--f-latin', theme.fonts.latin);
  s.setProperty('--f-script', theme.fonts.script);
  s.setProperty('--title-w', theme.fonts.titleWeight);

  const n = post.slides.length;
  document.getElementById('root').innerHTML = post.slides.map((sl, i) => {
    const layout = LAYOUTS[sl.type];
    if (!layout) throw new Error(`第 ${i + 1} 張：沒有「${sl.type}」這種版型`);
    const last = i === n - 1;
    return `<section class="slide t-${sl.type}">
      ${layout(sl, post, theme)}
      <footer>
        <span>${String(i + 1).padStart(2, '0')} / ${String(n).padStart(2, '0')}</span><i class="ln"></i>
        <span class="tag">${esc(post.seriesEn || '')}</span><i class="ln"></i>
        <span>${last ? '' : '左滑 →'}</span>
      </footer>
    </section>`;
  }).join('');
};

window.settleAll = () => [...document.querySelectorAll('.slide')].map(settle);
</script>
</body>
</html>
