<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #ccc; }
  .slide {
    --k: 1;
    position: relative; overflow: hidden;
    width: var(--w); height: var(--h);
    background: var(--bg); color: var(--ink);
    font-family: var(--f-body), sans-serif; font-weight: 300;
    line-break: strict; overflow-wrap: anywhere;
    margin-bottom: 40px;
  }
  .frame {
    position: absolute; inset: 110px 96px 170px 96px;
    display: flex; flex-direction: column; z-index: 2;
  }
  em { font-style: normal; color: var(--coral); }

  /* 標題：細字拉長 */
  .frame > * { flex: none; }
  .tw { position: relative; }
  .title {
    font-family: var(--f-title), sans-serif; font-weight: var(--title-w);
    line-height: 1.12; letter-spacing: .04em; white-space: pre-line; text-wrap: balance;
    transform: scaleY(var(--stretch)); transform-origin: top left;
  }
  .title em { font-weight: calc(var(--title-w) + 100); }
  .center .title { transform-origin: top center; text-align: center; }

  .kicker { font-size: calc(var(--k) * 36px); font-weight: 500; color: var(--coral); letter-spacing: .06em; }
  .rule { width: 72px; height: 3px; background: var(--teal); margin: 28px 0 48px; }
  .body { font-size: calc(var(--k) * 38px); line-height: 1.75; color: var(--muted); white-space: pre-line; text-wrap: pretty; }
  .latin { font-family: var(--f-latin), sans-serif; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; }

  footer {
    position: absolute; left: 96px; right: 96px; bottom: 72px; z-index: 3;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 22px; color: var(--apricot);
  }
  footer .page { color: var(--teal); letter-spacing: .14em; }
  footer .right { display: flex; align-items: center; gap: 28px; }
  .arrows { display: flex; gap: 8px; }
  .arrows i { width: 0; height: 0; border-left: 20px solid; border-top: 12px solid transparent; border-bottom: 12px solid transparent; }

  /* 裝飾 */
  .deco { position: absolute; z-index: 1; }
  .dots { background-image: radial-gradient(circle, currentColor 6px, transparent 7px); background-size: 44px 44px; }
  .stripes { background: repeating-linear-gradient(135deg, currentColor 0 14px, transparent 14px 34px); }
  .lines { border-top: 3px solid currentColor; transform: rotate(-38deg); }
  .lines::after { content: ""; position: absolute; left: 30px; right: -30px; top: 22px; border-top: 3px solid currentColor; }
  .ring {
    border-radius: 50%;
    background: repeating-linear-gradient(135deg, var(--apricot) 0 10px, transparent 10px 20px);
    -webkit-mask: radial-gradient(circle, transparent 62%, #000 62.5%);
  }

  /* cover */
  .t-cover .blob { left: -200px; top: -220px; width: 760px; height: 760px; border-radius: 50%; background: var(--teal); }
  .t-cover .emblem {
    left: 110px; top: 90px; width: 380px; height: 380px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.55);
    display: grid; place-items: center;
    font-family: var(--f-title); font-weight: 200; font-size: 230px; color: var(--bg);
  }
  .t-cover.has-photo .blob { left: -240px; top: -260px; width: 680px; height: 680px; }
  .t-cover .photo { left: 190px; top: 90px; width: 500px; height: 500px; border-radius: 50%; overflow: hidden; }
  .t-cover .photo img, .avatar img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.05); }
  .t-cover .vert { right: 96px; top: 110px; writing-mode: vertical-rl; font-size: 22px; color: var(--coral); }
  .t-cover .frame { justify-content: flex-end; }
  .t-cover .series { font-size: calc(var(--k) * 34px); font-weight: 500; color: var(--teal); letter-spacing: .08em; margin-bottom: 36px; }
  .t-cover .title { font-size: calc(var(--k) * 116px); }
  .t-cover .sub { font-size: calc(var(--k) * 40px); color: var(--muted); margin-top: 36px; }
  .t-cover .bar { height: 2px; background: var(--teal); margin-top: 56px; width: 120%; }

  /* statement */
  .t-statement .frame { justify-content: center; }
  .t-statement .title { font-size: calc(var(--k) * 120px); margin-bottom: 56px; }

  /* compare */
  .t-compare .title { font-size: calc(var(--k) * 76px); margin-bottom: 64px; }
  .cmp { display: grid; grid-template-columns: 1fr 64px 1fr; row-gap: 22px; align-items: stretch; }
  .cmp .h { font-size: calc(var(--k) * 32px); font-weight: 500; color: #fff; text-align: center; padding: 14px 0; border-radius: 999px; letter-spacing: .1em; margin-bottom: 8px; }
  .cmp .h.a { background: var(--teal); } .cmp .h.b { background: var(--coral); }
  .cmp .c { background: var(--card); padding: 30px 28px; font-size: calc(var(--k) * 36px); line-height: 1.45; display: flex; align-items: center; }
  .cmp .c.a { color: var(--muted); }
  .cmp .arr { display: grid; place-items: center; color: var(--apricot); }
  .cmp .arr i { border-left: 22px solid; border-top: 14px solid transparent; border-bottom: 14px solid transparent; }

  /* steps */
  .t-steps .title { font-size: calc(var(--k) * 92px); margin-bottom: 40px; }
  .step { display: flex; gap: 40px; align-items: baseline; padding: 34px 0; border-top: 2px solid rgba(110,158,155,.35); }
  .step:last-child { border-bottom: 2px solid rgba(110,158,155,.35); }
  .step .n { font-family: var(--f-latin); font-weight: 500; font-size: calc(var(--k) * 54px); color: var(--apricot); width: 90px; flex: none; }
  .step h3 { font-size: calc(var(--k) * 48px); font-weight: 500; margin-bottom: 10px; }
  .step p { font-size: calc(var(--k) * 32px); color: var(--muted); line-height: 1.5; }

  /* before / after */
  .t-beforeafter .title { font-size: calc(var(--k) * 96px); margin-bottom: 56px; }
  .box { text-wrap: pretty; padding: 40px 44px; font-size: calc(var(--k) * 38px); line-height: 1.65; }
  .box .lab { font-family: var(--f-latin); font-weight: 800; font-size: 24px; letter-spacing: .2em; margin-bottom: 14px; }
  .box.before { border: 2px dashed rgba(142,135,128,.6); color: var(--muted); }
  .box.after { background: var(--card); border-left: 10px solid var(--teal); }
  .box.after .lab { color: var(--teal); }
  .down { display: flex; justify-content: center; gap: 10px; margin: 26px 0; }
  .down i { border-top: 22px solid; border-left: 13px solid transparent; border-right: 13px solid transparent; }
  .note { margin-top: 44px; font-size: calc(var(--k) * 38px); font-weight: 500; color: var(--coral); }

  /* quote */
  .t-quote .frame { justify-content: center; }
  .t-quote .mark { font-family: var(--f-latin); font-weight: 800; font-size: 300px; line-height: .8; color: var(--apricot); height: 150px; }
  .t-quote .title { font-size: calc(var(--k) * 104px); line-height: 1.3; }
  .t-quote .by { margin-top: 70px; font-size: 24px; color: var(--teal); }

  /* cta */
  .t-cta .frame { align-items: center; justify-content: center; text-align: center; }
  .avatar { position: relative; width: 380px; height: 380px; margin-bottom: 64px; flex: none; }
  .avatar .ring { position: absolute; inset: 0; }
  .avatar .in {
    position: absolute; inset: 30px; border-radius: 50%; background: var(--teal);
    display: grid; place-items: center; overflow: hidden;
    font-family: var(--f-latin); font-weight: 700; font-size: 96px; color: var(--bg);
  }
  .t-cta .title { font-size: calc(var(--k) * 96px); }
  .t-cta .body { margin-top: 40px; }
  .btn { margin-top: 56px; background: var(--coral); color: #fff; font-size: calc(var(--k) * 40px); font-weight: 500; padding: 26px 64px; border-radius: 999px; letter-spacing: .08em; }
  .handle { margin-top: 36px; font-size: 26px; color: var(--teal); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// **重點** → <em>重點</em>
const hl = s => esc(s).replace(/\*\*([\s\S]+?)\*\*/g, '<em>$1</em>');
const title = s => `<div class="tw"><div class="title">${hl(s)}</div></div>`;
const chevrons = (color, flip) => `<svg width="150" height="110" viewBox="0 0 150 110" style="color:${color};${flip ? 'transform:scaleX(-1)' : ''}"><path d="M6 8 L6 100 L120 100" fill="none" stroke="currentColor" stroke-width="9"/><path d="M34 8 L34 72 L130 72 L34 8" fill="none" stroke="currentColor" stroke-width="9"/></svg>`;
const arrows = colors => `<div class="arrows">${colors.map(c => `<i style="color:var(--${c})"></i>`).join('')}</div>`;

const LAYOUTS = {
  cover: (s, p) => `
    <div class="deco blob"></div>
    ${s.photo ? `<div class="deco photo"><img src="${esc(s.photo)}"></div>` : `<div class="deco emblem">${esc(p.emblem || '')}</div>`}
    <div class="deco vert latin">NO.${esc(p.no)}</div>
    <div class="deco dots" style="right:96px;top:520px;width:132px;height:132px;color:var(--coral)"></div>
    <div class="deco lines" style="left:560px;top:430px;width:200px;color:var(--apricot)"></div>
    <div class="frame">
      <div class="series">${esc(p.series)} #${esc(p.no)}</div>
      ${title(s.title)}
      ${s.sub ? `<div class="sub">${hl(s.sub)}</div>` : ''}
      <div class="bar"></div>
    </div>`,
  statement: s => `
    <div class="deco" style="left:96px;top:96px">${chevrons('var(--coral)')}</div>
    <div class="deco" style="right:96px;top:96px">${chevrons('var(--teal)', true)}</div>
    <div class="deco lines" style="left:40px;bottom:330px;width:180px;color:var(--apricot)"></div>
    <div class="deco dots" style="right:96px;bottom:250px;width:220px;height:44px;color:var(--teal)"></div>
    <div class="frame">
      ${s.kicker ? `<div class="kicker">${hl(s.kicker)}</div><div class="rule"></div>` : ''}
      ${title(s.title)}
      <div class="body">${hl(s.body)}</div>
    </div>`,
  compare: s => `
    <div class="deco stripes" style="right:-60px;top:-60px;width:220px;height:220px;color:var(--coral);opacity:.9"></div>
    <div class="frame">
      ${title(s.title)}
      <div class="cmp">
        <div class="h a">${esc(s.a)}</div><div></div><div class="h b">${esc(s.b)}</div>
        ${s.rows.map(([a, b]) => `<div class="c a">${hl(a)}</div><div class="arr"><i></i></div><div class="c">${hl(b)}</div>`).join('')}
      </div>
    </div>`,
  steps: s => `
    <div class="deco" style="right:-150px;top:-150px;width:300px;height:300px;border-radius:50%;background:var(--teal)"></div>
    <div class="deco dots" style="left:96px;bottom:190px;width:220px;height:44px;color:var(--apricot)"></div>
    <div class="frame">
      ${title(s.title)}
      <div>${s.items.map(([h, d], i) => `<div class="step"><div class="n">${String(i + 1).padStart(2, '0')}</div><div><h3>${hl(h)}</h3><p>${hl(d)}</p></div></div>`).join('')}</div>
    </div>`,
  beforeafter: s => `
    <div class="deco" style="right:96px;top:110px">${chevrons('var(--coral)', true)}</div>
    <div class="frame">
      ${title(s.title)}
      <div class="box before"><div class="lab">BEFORE</div>${hl(s.before)}</div>
      <div class="down"><i style="color:var(--teal)"></i><i style="color:var(--apricot)"></i><i style="color:var(--coral)"></i></div>
      <div class="box after"><div class="lab">AFTER</div>${hl(s.after)}</div>
      ${s.note ? `<div class="note">▸ ${hl(s.note)}</div>` : ''}
    </div>`,
  quote: (s, p, t) => `
    <div class="deco stripes" style="left:-40px;top:-40px;width:260px;height:260px;color:var(--coral)"></div>
    <div class="deco lines" style="right:50px;bottom:300px;width:200px;color:var(--apricot)"></div>
    <div class="frame">
      <div class="mark">“</div>
      ${title(s.text)}
      <div class="by latin">— ${esc(t.author)}</div>
    </div>`,
  cta: (s, p, t) => `
    <div class="deco dots" style="left:60px;top:80px;width:132px;height:132px;color:var(--teal)"></div>
    <div class="deco" style="right:96px;bottom:200px">${chevrons('var(--coral)', true)}</div>
    <div class="frame center">
      <div class="avatar"><div class="ring"></div><div class="in">${t.avatar ? `<img src="${esc(t.avatar)}">` : esc(t.author[0])}</div></div>
      ${title(s.title)}
      ${s.body ? `<div class="body">${hl(s.body)}</div>` : ''}
      ${s.button ? `<div class="btn">${hl(s.button)}</div>` : ''}
      <div class="handle latin">${esc(t.handle)}</div>
    </div>`,
};

// 拉長的標題不佔版面高度，補回差額；內容超出就整張等比縮字
function settle(slide, stretch) {
  const frame = slide.querySelector('.frame');
  const fix = () => slide.querySelectorAll('.tw').forEach(w => {
    const t = w.firstElementChild;
    w.style.height = t.offsetHeight * stretch + parseFloat(getComputedStyle(t).marginBottom) + 'px';
  });
  let k = 1;
  fix();
  while (frame.scrollHeight > frame.clientHeight + 1 && k > 0.6) {
    k = +(k - 0.04).toFixed(2);
    slide.style.setProperty('--k', k);
    fix();
  }
  return { k, overflow: frame.scrollHeight > frame.clientHeight + 1 };
}

window.render = (theme, post) => {
  const s = document.documentElement.style;
  const [w, h] = theme.size;
  s.setProperty('--w', w + 'px'); s.setProperty('--h', h + 'px');
  for (const [k, v] of Object.entries(theme.colors)) s.setProperty('--' + k, v);
  s.setProperty('--f-title', theme.fonts.title);
  s.setProperty('--f-body', theme.fonts.body);
  s.setProperty('--f-latin', theme.fonts.latin);
  s.setProperty('--title-w', theme.fonts.titleWeight);
  s.setProperty('--stretch', theme.fonts.titleStretch);

  const n = post.slides.length;
  document.getElementById('root').innerHTML = post.slides.map((sl, i) => {
    const layout = LAYOUTS[sl.type];
    if (!layout) throw new Error(`第 ${i + 1} 張：沒有「${sl.type}」這種版型`);
    const last = i === n - 1;
    return `<section class="slide t-${sl.type}${sl.photo ? ' has-photo' : ''}">
      ${layout(sl, post, theme)}
      <footer>
        <div class="latin">${esc(post.seriesEn || '')}</div>
        <div class="right"><span class="page latin">${String(i + 1).padStart(2, '0')} / ${String(n).padStart(2, '0')}</span>
        ${last ? '' : arrows(['teal', 'apricot', 'coral'])}</div>
      </footer>
    </section>`;
  }).join('');
};

window.settleAll = stretch => [...document.querySelectorAll('.slide')].map(el => settle(el, stretch));
</script>
</body>
</html>
