  <div id="cap-h-01-1" class="clip caption" data-start="0.343" data-duration="1.322"><span>你叫 AI 寫請假信</span></div>

  <div id="cap-h-02-2" class="clip caption" data-start="5.347" data-duration="1.603"><span>在你怎麼交代</span></div>

  <div id="cap-t-01-2" class="clip caption" data-start="8.480" data-duration="2.325"><span>就跟交代新人做事一樣</span></div>
  <div id="cap-t-02-1" class="clip caption" data-start="11.098" data-duration="0.725"><span>新人第一天</span></div>
  <div id="cap-t-02-2" class="clip caption" data-start="11.823" data-duration="2.497"><span>你會先跟他講清楚四件事</span></div>

  <div id="cap-b-02-2" class="clip caption" data-start="20.090" data-duration="1.443"><span>要請一天</span></div>

  <div id="cap-b-03-2" class="clip caption" data-start="23.191" data-duration="2.380"><span>寫一封請假信給主管</span></div>
  <div id="cap-b-04-1" class="clip caption" data-start="25.864" data-duration="2.090"><span>第四　格式　語氣客氣</span></div>
  <div id="cap-b-04-2" class="clip caption" data-start="27.954" data-duration="1.394"><span>一百字以內</span></div>
  <div id="cap-p-01-1" class="clip caption" data-start="29.641" data-duration="3.196"><span>多寫三十個字　省下來回改三次</span></div>
