<div id="captions" data-track-kind="captions">
  <div id="cap-h-01-1" class="clip caption" data-start="0.336" data-duration="1.635"><span>如果 AI 只能幫你做一件事</span></div>
  <div id="cap-h-01-2" class="clip caption" data-start="1.971" data-duration="1.856"><span>你最想丟給它什麼？</span></div>
  <div id="cap-h-02-1" class="clip caption" data-start="4.043" data-duration="1.315"><span>寫週報　整理 Excel</span></div>
  <div id="cap-h-02-2" class="clip caption" data-start="5.358" data-duration="2.123"><span>回客訴信　還是做簡報？</span></div>
  <div id="cap-a-01-1" class="clip caption" data-start="7.697" data-duration="1.706"><span>留言告訴我　我挑三個</span></div>
  <div id="cap-a-01-2" class="clip caption" data-start="9.403" data-duration="1.654"><span>做成影片教你</span></div>
  <div id="cap-t-01-1" class="clip caption" data-start="11.273" data-duration="2.289"><span>在那之前　先送你一招萬用的</span></div>
  <div id="cap-t-02-1" class="clip caption" data-start="13.778" data-duration="0.640"><span>不知道怎麼問</span></div>
  <div id="cap-t-02-2" class="clip caption" data-start="14.418" data-duration="1.597"><span>就叫 AI 先問你</span></div>
  <div id="cap-t-03-1" class="clip caption" data-start="16.231" data-duration="1.671"><span>像這樣　幫我規劃部門尾牙</span></div>
  <div id="cap-t-03-2" class="clip caption" data-start="17.902" data-duration="2.342"><span>開始前　先問我三個問題</span></div>
  <div id="cap-r-01-1" class="clip caption" data-start="20.460" data-duration="0.284"><span>它問的</span></div>
  <div id="cap-r-01-2" class="clip caption" data-start="20.744" data-duration="2.658"><span>常常就是你自己還沒想清楚的地方</span></div>
  <div id="cap-j-01-1" class="clip caption" data-start="23.618" data-duration="0.995"><span>AI 能做的事很多</span></div>
  <div id="cap-j-01-2" class="clip caption" data-start="24.613" data-duration="2.240"><span>但哪件交給它　哪件留給自己</span></div>
  <div id="cap-j-01-3" class="clip caption" data-start="26.853" data-duration="1.274"><span>是你的判斷</span></div>
  <div id="cap-c-01-1" class="clip caption" data-start="28.343" data-duration="0.640"><span>留言「指令」</span></div>
  <div id="cap-c-01-2" class="clip caption" data-start="28.983" data-duration="1.528"><span>加上你最想交給 AI 的事</span></div>
  <div id="cap-c-01-3" class="clip caption" data-start="30.511" data-duration="2.211"><span>我私訊送你三十招指令包</span></div>
