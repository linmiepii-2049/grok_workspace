<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#f3efe6"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#121110"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>JTeam 成品庫</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23d9432b'/%3E%3Ctext x='16' y='22' font-size='16' font-family='serif' font-weight='900' fill='%23f3efe6' text-anchor='middle'%3EJT%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap"
    />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <a class="skip" href="#app">跳到內容</a>
    <main id="app" tabindex="-1" aria-live="polite"></main>
    <dialog id="confirm" aria-labelledby="confirm-title">
      <form method="dialog">
        <h2 id="confirm-title">移到 Google Drive？</h2>
        <div class="confirm-text"></div>
        <div class="confirm-actions">
          <button class="btn" value="cancel">取消</button>
          <button class="btn primary" value="ok">確定搬移</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/app.js"></script>
  </body>
</html>
